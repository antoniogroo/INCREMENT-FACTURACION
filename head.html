<meta charset="utf-8">
<title>INCREMENT FACTURACION</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral de libro contable + área de trabajo; el editor usa columna de captura y resumen fijo a la derecha. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface-2:#e4ebe9; --fg:#14211e; --muted:#566864; --line:#cfdad7;
  --accent:#0b6b52; --accent-fg:#ffffff; --accent-weak:#dcefe8; --ink:#1f3d7a;
  --ok:#15703a; --ok-bg:#dff3e6; --warn:#8a5300; --warn-bg:#fcefd6; --bad:#b42318; --bad-bg:#fde4e1; --info-bg:#e1ebfa; --efos:#6a2bb0; --efos-bg:#efe5fb;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1614; --surface:#15201d; --surface-2:#1c2a27; --fg:#e3ece9; --muted:#93a6a1; --line:#2a3b37;
  --accent:#43c49a; --accent-fg:#06281e; --accent-weak:#123a30; --ink:#8fb2f5;
  --ok:#5fd68a; --ok-bg:#12331f; --warn:#f2b660; --warn-bg:#3a2a0f; --bad:#ff8577; --bad-bg:#3d1714; --info-bg:#172a45; --efos:#cfa8ff; --efos-bg:#2c1b47; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#15201d; --surface-2:#1c2a27; --fg:#e3ece9; --muted:#93a6a1; --line:#2a3b37;
  --accent:#43c49a; --accent-fg:#06281e; --accent-weak:#123a30; --ink:#8fb2f5;
  --ok:#5fd68a; --ok-bg:#12331f; --warn:#f2b660; --warn-bg:#3a2a0f; --bad:#ff8577; --bad-bg:#3d1714; --info-bg:#172a45; --efos:#cfa8ff; --efos-bg:#2c1b47; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);font-stretch:85%;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(1.5rem,1.1rem + 1.4vw,2.1rem);font-weight:750}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.92em;font-variant-numeric:tabular-nums}
.up{text-transform:uppercase}
.muted{color:var(--muted)} .small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.req{color:var(--bad);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.splash{display:grid;place-items:center;min-height:60vh;color:var(--muted);font-family:var(--f-display);font-size:1.2rem}

/* botones */
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);padding:.55rem 1rem;border-radius:var(--r);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;text-align:center;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:.32rem .7rem;font-size:.85rem}
.btn.block{width:100%}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.x{background:none;border:0;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--muted);padding:.1rem .4rem;border-radius:6px}
.x:hover{background:var(--surface-2);color:var(--fg)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:.42rem .85rem;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

/* campos */
.fld{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.fld label{font-size:.78rem;font-weight:600;color:var(--muted)}
.fld small{color:var(--muted);font-size:.78rem}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.5rem .6rem;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-weak)}
.row>select{min-width:0;flex:1 1 12rem}
select.sm{width:auto;max-width:100%;padding:.32rem .5rem;font-size:.85rem}
input.num{text-align:right;width:8.5rem}
.inline{display:flex;gap:.4rem}.inline input{flex:1}
.check{display:flex;gap:.55rem;align-items:flex-start;font-size:.9rem;cursor:pointer;margin:.4rem 0}
.check input{width:auto;margin-top:.25rem;accent-color:var(--accent)}
.grid2,.grid3,.grid4{display:grid;gap:.8rem}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid2 .wide{grid-column:1/-1}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.row{display:flex;gap:.6rem;align-items:flex-end}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:14rem}
.ferr{color:var(--bad);font-weight:600;font-size:.9rem}
.note{background:var(--surface-2);border-radius:6px;padding:.6rem .8rem;font-size:.88rem;color:var(--fg)}

/* autenticación */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr minmax(0,26rem);gap:clamp(1.5rem,4vw,4rem);align-items:center;padding-block:2rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:72rem;margin:0 auto}
.auth-intro h1{font-size:clamp(2rem,1.3rem + 2.6vw,3.3rem);font-weight:800;margin:1.6rem 0 .8rem;max-width:16ch}
.auth-intro p{max-width:56ch;color:var(--muted);font-size:1.05rem}
.ticks{list-style:none;padding:0;margin:1.4rem 0 0;display:grid;gap:.5rem}
.ticks li{padding-left:1.6rem;position:relative}
.ticks li::before{content:"";position:absolute;left:0;top:.45rem;width:.85rem;height:.45rem;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.5rem;display:grid;gap:1rem}
.auth-card form{display:grid;gap:.85rem}
.auth-card .seg{display:flex}.auth-card .seg button{flex:1}
.or{display:flex;align-items:center;gap:.8rem;color:var(--muted);font-size:.85rem}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* marca */
.brand{display:flex;align-items:center;gap:.6rem}
.brand b{font-family:var(--f-display);font-size:1.25rem;font-weight:800;display:block;line-height:1}
.brand small{color:var(--muted);font-size:.75rem}
.mark{font-family:var(--f-mono);font-weight:500;font-size:.8rem;background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:.38rem .42rem;letter-spacing:-.02em}
.brand.big b{font-size:1.6rem}

/* shell */
.shell{display:grid;grid-template-columns:15.5rem minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:1.2rem 1rem;display:flex;flex-direction:column;gap:1.1rem;position:sticky;top:0;height:100vh;overflow-y:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{text-align:left;background:none;border:0;padding:.5rem .7rem;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:600}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button.on{background:var(--accent-weak);color:var(--accent)}
.emsel select{font-size:.85rem}
.who{margin-top:auto;display:flex;flex-direction:column;gap:.3rem;font-size:.85rem;border-top:1px solid var(--line);padding-top:.8rem}
.who .link{align-self:flex-start}
.main{padding-block:1.6rem 4rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;max-width:86rem;width:100%}
@media (min-width:900px){.main{padding-left:2.2rem;padding-right:2.2rem}}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.4rem}
.ph .eyebrow{margin-bottom:.3rem}
.block{margin-top:2rem}
.block>h2,.bh{margin-bottom:.8rem}
.bh{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:1.2rem;color:var(--muted)}

/* panel */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:1rem 1.1rem;display:grid;gap:.15rem}
.kpi span{font-size:.8rem;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--f-display);font-size:1.55rem;font-weight:750;font-variant-numeric:tabular-nums;font-stretch:90%}
.kpi small{color:var(--muted);font-size:.78rem}
.alerts{display:grid;gap:.5rem;margin-top:1rem}
.alert{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem .9rem;border-radius:var(--r);background:var(--info-bg);border-left:4px solid var(--ink);font-size:.9rem;flex-wrap:wrap}
.alert.warn{background:var(--warn-bg);border-color:var(--warn)}.alert.bad{background:var(--bad-bg);border-color:var(--bad)}.alert.info{background:var(--info-bg);border-color:var(--ink)}
.alert span{flex:1;min-width:12rem}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(13.5rem,1fr));gap:.6rem}
.qcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.85rem .95rem;cursor:pointer;display:grid;gap:.2rem;align-content:start}
.qcard:hover,.qcard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.qcard b{font-weight:650;line-height:1.3}
.qcard span{color:var(--muted);font-size:.85rem}
.qcard em{font-style:normal;font-family:var(--f-mono);font-size:.75rem;color:var(--accent)}
.quick.small{grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));margin-bottom:1rem}

/* tablas */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:.6rem .8rem;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:.6rem .8rem;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
td.acts{white-space:nowrap;text-align:right}td.acts .btn+.btn{margin-left:.3rem}
.chip{display:inline-block;font-size:.74rem;font-weight:600;padding:.12rem .5rem;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.filters{display:flex;gap:.7rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:1rem}
.filters .fld:not(.grow){min-width:10rem}
table.legal td:first-child{white-space:nowrap}
.plain{padding-left:1.1rem;margin:.4rem 0}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 21rem;gap:1.4rem;align-items:start}
.ecol{display:grid;gap:1rem;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.2rem;display:grid;gap:.9rem}
.card h2{display:flex;align-items:center;gap:.6rem}
.card h2 .n{font-family:var(--f-mono);font-size:.72rem;font-weight:500;background:var(--fg);color:var(--bg);border-radius:4px;padding:.15rem .4rem;min-width:1.6rem;text-align:center}
.cpcard h2 .n{background:var(--ink)}
.sub{font-size:.95rem;margin-top:.3rem}
.concepto,.ubic{border:1px solid var(--line);border-radius:8px;padding:.8rem;display:grid;gap:.7rem;background:var(--bg)}
.conceptos{display:grid;gap:.7rem}
.chead{display:flex;align-items:center;gap:.6rem}
.chead b{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.chead .lt{margin-left:auto;font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.chead select{margin-left:auto}
.chead .x{margin-left:.2rem}
.taxes summary{cursor:pointer;font-weight:600;font-size:.85rem;color:var(--accent);margin-bottom:.6rem}
.opline{align-items:end;grid-template-columns:repeat(4,minmax(0,1fr)) auto}
.eside{min-width:0}
.sticky{position:sticky;top:calc(1rem + env(safe-area-inset-top,0px));display:grid;gap:.8rem}
.sumcard{background:var(--fg);color:var(--bg);border-radius:10px;padding:1.1rem 1.2rem}
.sumcard .eyebrow{color:inherit;opacity:.7}
.sumcard .muted{color:inherit;opacity:.75}
.tot{margin:.7rem 0 0;display:grid;gap:.3rem}
.tot div{display:flex;justify-content:space-between;gap:1rem;font-size:.9rem}
.tot dt{opacity:.8}.tot dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tot .grand{border-top:1px solid color-mix(in srgb,var(--bg) 35%,transparent);padding-top:.5rem;margin-top:.3rem;font-size:1.05rem}
.tot .grand dd{font-family:var(--f-display);font-weight:750;font-size:1.45rem}
.valid{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;max-height:46vh;overflow-y:auto}
.valid h3{font-size:.95rem;margin-bottom:.5rem}
.valid ul{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.valid li{display:grid;gap:.1rem;padding-left:.75rem;border-left:3px solid var(--bad);font-size:.86rem}
.valid li.w{border-color:var(--warn)}
.valid li small{color:var(--muted);font-size:.74rem}

/* modales */
.overlay{position:fixed;inset:0;background:rgb(10 20 18 / .55);display:grid;place-items:center;z-index:50;padding-block:max(1rem,env(safe-area-inset-top,0px)) max(1rem,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#modal2{z-index:60}
.sheet{background:var(--surface);border-radius:12px;width:min(36rem,100%);max-height:calc(100vh - 2rem);overflow-y:auto;padding:1.2rem 1.3rem;display:grid;gap:.9rem;box-shadow:0 20px 50px rgb(0 0 0 / .3)}
.sheet.wide{width:min(56rem,100%)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.mf{display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap;padding-top:.4rem}
.uuid{font-size:.95rem;word-break:break-all}
.xml{background:var(--surface-2);border-radius:8px;padding:.9rem;font:12px/1.5 var(--f-mono);overflow:auto;max-height:55vh;white-space:pre;margin:0}
.revgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;background:var(--surface-2);border-radius:8px;padding:1rem}
.revgrid p+p{margin-top:.2rem}
.big{font-family:var(--f-display);font-size:1.5rem;font-weight:750;font-variant-numeric:tabular-nums}
.catres{display:grid;gap:2px;max-height:52vh;overflow-y:auto}
.catrow{display:grid;grid-template-columns:6.5rem minmax(0,1fr) auto;gap:.6rem;text-align:left;background:none;border:0;border-radius:6px;padding:.5rem .6rem;cursor:pointer;align-items:center}
.catrow:hover{background:var(--accent-weak)}
.emgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(18rem,1fr));gap:.8rem}
.emcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem;display:grid;gap:.45rem;align-content:start}
.emcard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal{list-style:none;padding:0;margin:0;display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal li{display:grid;grid-template-columns:8rem minmax(0,1fr);gap:1rem;background:var(--surface);padding:.7rem .9rem}
.cal b{font-family:var(--f-display);font-stretch:85%}
#toasts{position:fixed;bottom:calc(1rem + env(safe-area-inset-bottom,0px));right:max(1rem,env(safe-area-inset-right,0px));display:grid;gap:.5rem;z-index:80;max-width:min(26rem,calc(100vw - 2rem))}
.toast{background:var(--fg);color:var(--bg);padding:.7rem 1rem;border-radius:8px;font-size:.9rem;box-shadow:0 8px 24px rgb(0 0 0 / .25);transition:opacity .4s,transform .4s;border-left:4px solid var(--muted)}
.toast.ok{border-color:var(--ok)}.toast.warn{border-color:var(--warn)}.toast.bad{border-color:var(--bad)}
.toast.out{opacity:0;transform:translateY(6px)}


/* fricción cero */
kbd{font-family:var(--f-mono);font-size:.72em;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 .3em;background:var(--surface);color:var(--fg);margin:0 .1em;white-space:nowrap}
.btn kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.75}
.kbar{display:flex;flex-wrap:wrap;gap:.4rem 1rem;font-size:.78rem;color:var(--muted);margin:.2rem 0 0}
.gtools{display:grid;gap:.6rem;grid-template-columns:minmax(0,1fr)}
.switch{display:inline-flex;align-items:center;gap:.45rem;font-weight:600;font-size:.88rem;cursor:pointer;background:var(--accent-weak);color:var(--accent);padding:.32rem .7rem;border-radius:999px}
.switch input{width:auto;accent-color:var(--accent)}
.gridwrap{border-radius:8px}
.cgrid{font-size:.85rem;min-width:62rem}
.cgrid th{padding:.45rem .4rem}
.cgrid td{padding:.25rem .3rem;vertical-align:middle;border-bottom:1px solid var(--line)}
.cgrid input,.cgrid select{padding:.38rem .4rem;border-radius:4px;font-size:.85rem}
.cgrid input.r{text-align:right}
.cgrid td.gnum{font-family:var(--f-mono);color:var(--muted);text-align:center;width:2rem}
.cgrid td.gdesc{min-width:14rem}
.cgrid td:nth-child(2){min-width:8.5rem}
.cgrid td.gneto{min-width:8rem}
.cgrid td.gneto small{display:block;font-size:.7rem;text-align:right;font-weight:600}
.cgrid small.ok{color:var(--ok)} .cgrid small.bad{color:var(--bad)}
.cgrid tr.gmore td{background:var(--surface-2)}
.x.sm{font-size:1rem}
.fixb{justify-self:start;margin-top:.25rem}
.valid li{gap:.15rem}
.palette{width:min(38rem,100%);align-self:start;margin-top:10vh}
.palette input{font-size:1.05rem;padding:.7rem .8rem}
.palres{display:grid;gap:2px;max-height:50vh;overflow-y:auto}
.palrow{display:flex;gap:.6rem;align-items:center;text-align:left;background:none;border:0;padding:.5rem .6rem;border-radius:6px;cursor:pointer}
.palrow.on,.palrow:hover{background:var(--accent-weak)}
.trad{display:grid;gap:.6rem;margin-top:.6rem}
.trad .lead{font-weight:600}
/* PDF */
.pdfpages{display:grid;gap:1rem;max-height:70vh;overflow-y:auto;background:var(--surface-2);padding:1rem;border-radius:8px;justify-items:center}
.pdfpage{width:100%;max-width:46rem;height:auto;box-shadow:0 2px 12px rgb(0 0 0 / .18);background:#fff}
.pdfcfg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1.2rem;align-items:start}
.pdfprev .pdfpages{max-height:none}
.swatch{width:2.2rem;height:2.2rem;border-radius:50%;border:2px solid var(--line);cursor:pointer;background:linear-gradient(135deg,var(--sw) 55%,var(--sw2) 55%)}
.swatch.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
input[type=color]{height:2.4rem;padding:.2rem;cursor:pointer}
input[type=range]{padding:0;accent-color:var(--accent)}
/* masiva */
.tabs{margin-bottom:1rem}
.masbody{display:grid;gap:1rem}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:.9rem}
